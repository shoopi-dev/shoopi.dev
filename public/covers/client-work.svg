    <circle cx="72" cy="33" r="9" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="104" cy="33" r="9" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="44" y="112" width="300" height="26" rx="13" fill="#ffffff" fill-opacity="0.75"/>
    <rect x="44" y="160" width="420" height="16" rx="8" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="44" y="192" width="360" height="16" rx="8" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="44" y="248" width="150" height="44" rx="22" fill="#ffffff" fill-opacity="0.85"/>
  </g>

